name: BlueMapHUD
version: '${version}'
main: com.extantape.bluemaphud.BlueMapHudPlugin
api-version: '1.21.11'
description: A BlueMap-sourced minimap and fullscreen map, drawn with a resource pack font.
website: https://github.com/ExtantApe/BlueMapHUD
depend: [BlueMap]
softdepend: [floodgate]
permissions:
  bluemaphud.use:
    description: See and control the minimap.
    default: true
  bluemaphud.fullscreen:
    description: Open the fullscreen map.
    default: true
  bluemaphud.seeplayers:
    description: See other players on the map.
    default: true
  bluemaphud.admin:
    description: Use /bmhud reload, debug and pack commands.
    default: op
