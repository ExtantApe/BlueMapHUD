name: BlueMinimap
version: '${version}'
main: com.extantape.blueminimap.BlueMinimapPlugin
api-version: '26.1'
description: A BlueMap minimap and coordinates HUD, with a fullscreen map, drawn with a resource pack font.
website: https://github.com/ExtantApe/BlueMinimap
# Commands are registered with Brigadier in code, so there is no commands section.
dependencies:
  server:
    # BlueMap must load first, and its API classes must be visible to this plugin.
    BlueMap:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional, for spotting Bedrock players. Reached by reflection, so it needs the classpath too.
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  blueminimap.use:
    description: See and control the minimap.
    default: true
  blueminimap.fullscreen:
    description: Open the fullscreen map.
    default: true
  blueminimap.seeplayers:
    description: See other players on the map.
    default: true
  blueminimap.share.send:
    description: Share your coordinates with /hud share.
    default: true
  blueminimap.share.receive:
    description: Receive coordinates other players share.
    default: true
  blueminimap.admin:
    description: Use /blueminimap reload, debug and pack commands.
    default: op
  bluemaphud.use:
    description: The old name for blueminimap.use, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: true
  bluemaphud.fullscreen:
    description: The old name for blueminimap.fullscreen, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: true
  bluemaphud.seeplayers:
    description: The old name for blueminimap.seeplayers, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: true
  bluemaphud.share.send:
    description: The old name for blueminimap.share.send, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: true
  bluemaphud.share.receive:
    description: The old name for blueminimap.share.receive, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: true
  bluemaphud.admin:
    description: The old name for blueminimap.admin, from before the rename. Still respected in 0.2.x (a "no" on either name wins for nodes that are on by default) and removed in the next release.
    default: op
